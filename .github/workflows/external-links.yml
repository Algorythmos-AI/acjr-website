name: External links

# Weekly, outside the merge gate: a slow or moved foreign site should alert us,
# not block pull requests.
on:
  schedule: [{ cron: '0 6 * * 1' }]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-links.mjs
      - run: node scripts/check-external-links.mjs
