name: Visual baselines

# Makes fresh Linux screenshots for tests/visual.spec.ts on every pull request and uploads them as
# an artifact. Nothing is committed from here: when a visual change is intended, download the
# artifact and commit it into tests/visual.spec.ts-snapshots/ (see README.md). The Check workflow
# compares each pull request against the committed baselines.
on:
  pull_request:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run build:drafts && npm run build:fixtures
      - run: npx playwright test tests/visual.spec.ts --update-snapshots=all
        env:
          VISUAL: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines
          path: tests/visual.spec.ts-snapshots/
          retention-days: 14
