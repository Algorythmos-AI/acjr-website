<title>ACJR Homepage Directions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@400;500;700&family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: a review toolbar above one live homepage frame; the frame uses container queries so the
   Mobile toggle reflows it exactly like a phone. Single light theme: the real site is light-only. */
:root {
  color-scheme: light;
  --blue-500: #009edb; --blue-700: #0070ad; --blue-800: #00609a; --blue-50: #e6f4fb;
  --navy-900: #0b2545; --navy-800: #13325a; --charcoal: #333333; --ink: #222222;
  --grey-600: #4d4d4d; --grey-200: #d9dee5; --grey-50: #f2f4f7; --white: #ffffff;
  --ochre-500: #c8963e; --ochre-700: #8f631d; --ochre-50: #fdf6e9; --link-on-dark: #7fd3f7;
  --tool-bg: #e9ecf1;
  --serif: 'Merriweather', Georgia, serif;
  --sans: 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --ar-serif: 'Noto Naskh Arabic', 'Geeza Pro', serif;
  --ar-sans: 'Noto Sans Arabic', 'Geeza Pro', Tahoma, sans-serif;
  --ease: cubic-bezier(.2,.7,.2,1);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--tool-bg); color: var(--ink); font-family: var(--sans); }

/* ---------- review toolbar (not part of the design) ---------- */
.tool {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--white); border-bottom: 1px solid var(--grey-200); font-size: 13px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--white); }
.tool h1 { font: 700 14px/1.2 var(--sans); margin: 0; color: var(--navy-900); margin-inline-end: auto; }
.tool h1 small { display: block; font-weight: 400; color: var(--grey-600); margin-top: 2px; }
.seg { display: inline-flex; border: 1px solid var(--grey-200); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 13px/1 var(--sans); padding: 8px 12px; border: 0; background: var(--white); color: var(--ink); cursor: pointer; }
.seg button + button { border-inline-start: 1px solid var(--grey-200); }
.seg button[aria-pressed="true"] { background: var(--navy-900); color: var(--white); }
.seg button:focus-visible { outline: 3px solid var(--blue-500); outline-offset: -3px; }
.seg-label { color: var(--grey-600); margin-inline-end: 6px; }
.note {
  margin: 14px auto 0; max-width: 1240px; font-size: 13px; color: var(--grey-600);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.note strong { color: var(--ink); }
.stage { padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.frame { margin-inline: auto; max-width: 1240px; background: var(--white); box-shadow: 0 1px 2px rgb(11 37 69 / .08), 0 8px 32px rgb(11 37 69 / .10); overflow: hidden; transition: max-width .35s var(--ease); }
.frame.is-mobile { max-width: 390px; border-radius: 28px; border: 10px solid var(--navy-900); }

/* ---------- the site ---------- */
.site { container-type: inline-size; container-name: site; font-size: 17px; line-height: 1.6; color: var(--ink); background: var(--white); }
.site[lang="ar"] { font-family: var(--ar-sans); line-height: 1.8; }
.site h1, .site h2, .site h3 { font-family: var(--serif); color: var(--navy-900); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.site[lang="ar"] h1, .site[lang="ar"] h2, .site[lang="ar"] h3 { font-family: var(--ar-serif); letter-spacing: 0; line-height: 1.5; }
.site p { margin: 0; text-wrap: pretty; }
.wrap { max-width: 1160px; margin-inline: auto; padding-inline: 16px; }
@container site (min-width: 768px) { .wrap { padding-inline: 32px; } }
.eyebrow { font: 700 12px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--blue-700); margin-bottom: 12px; }
.site[lang="ar"] .eyebrow { font-family: var(--ar-sans); letter-spacing: 0; font-size: 14px; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 2px; font: 700 15px/1 var(--sans); text-decoration: none; border: 2px solid var(--blue-700); background: var(--blue-700); color: var(--white); }
.site[lang="ar"] .btn { font-family: var(--ar-sans); }
.btn:hover { background: var(--blue-800); border-color: var(--blue-800); }
.btn--ghost { background: transparent; color: var(--blue-700); }
.btn--ghost:hover { background: var(--blue-50); color: var(--blue-800); }
.btn--light { background: var(--white); border-color: var(--white); color: var(--navy-900); }
.btn--outline-light { background: transparent; border-color: rgb(255 255 255 / .8); color: var(--white); }
.btn--outline-light:hover { background: rgb(255 255 255 / .1); border-color: var(--white); }
.btn:focus-visible, .site a:focus-visible { outline: 3px solid var(--blue-500); outline-offset: 3px; }
.ico { width: 18px; height: 18px; flex: none; }
[dir="rtl"] .flip { transform: scaleX(-1); }
.link { color: var(--blue-700); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

/* utility bar + header */
.util { background: var(--navy-900); color: var(--white); font-size: 13px; }
.util .wrap { display: flex; justify-content: space-between; align-items: center; min-height: 36px; gap: 12px; }
.util-tag { opacity: .9; display: none; }
@container site (min-width: 768px) { .util-tag { display: block; } }
.langs { display: flex; gap: 2px; margin-inline-start: auto; }
.langs span { padding: 8px 10px; font-weight: 700; color: rgb(255 255 255 / .85); }
.langs span.on { color: var(--white); box-shadow: inset 0 -3px var(--blue-500); }
.search-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--white); font-weight: 500; padding: 6px 10px; border-inline-start: 1px solid rgb(255 255 255 / .2); }
.head { border-top: 4px solid var(--blue-500); border-bottom: 1px solid var(--grey-200); background: var(--white); }
.head .wrap { display: flex; align-items: center; gap: 16px; min-height: 76px; }
.lockup { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--navy-900); }
.lockup svg { width: 52px; height: 52px; }
.lockup .div { width: 1px; align-self: stretch; background: var(--grey-200); margin-block: 6px; }
.lockup b { display: block; font: 700 22px/1 var(--sans); letter-spacing: .02em; }
.lockup small { display: block; font-size: 12px; line-height: 1.25; color: var(--grey-600); max-width: 15ch; margin-top: 4px; }
.site[lang="ar"] .lockup small { font-family: var(--ar-sans); font-size: 13px; }
.nav { display: none; margin-inline-start: auto; gap: 4px; }
.nav span { padding: 10px 12px; font-weight: 500; font-size: 15px; color: var(--ink); display: inline-flex; gap: 4px; align-items: center; }
.nav span:first-child { box-shadow: inset 0 -3px transparent; }
.menu-btn { margin-inline-start: auto; display: inline-flex; gap: 8px; align-items: center; font-weight: 700; border: 2px solid var(--navy-900); padding: 10px 14px; color: var(--navy-900); }
@container site (min-width: 1000px) { .nav { display: flex; } .menu-btn { display: none; } }

/* sections */
.sec { padding-block: 56px; }
@container site (min-width: 768px) { .sec { padding-block: 88px; } }
.sec--grey { background: var(--grey-50); }
.sec--navy { background: var(--navy-900); color: var(--white); }
.sec--navy h2, .sec--navy h3 { color: var(--white); }
.sec-head { max-width: 46rem; margin-bottom: 36px; }
.sec-head h2 { font-size: clamp(28px, 4.2cqi, 40px); line-height: 1.2; }
.sec-head p { margin-top: 12px; font-size: 19px; color: var(--grey-600); }
.sec--navy .sec-head p { color: rgb(255 255 255 / .88); }
.rule-ochre { width: 64px; height: 4px; background: var(--ochre-500); border: 0; margin: 20px 0; }

/* pathways */
.paths { display: grid; gap: 16px; }
@container site (min-width: 768px) { .paths { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; } }
.path { display: grid; gap: 12px; align-content: start; padding: 24px; background: var(--white); border: 1px solid var(--grey-200); border-top: 4px solid var(--blue-500); text-decoration: none; color: inherit; transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
.path:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgb(11 37 69 / .12); }
.path .pi { width: 44px; height: 44px; color: var(--blue-700); }
.path h3 { font-size: 21px; line-height: 1.3; }
.path p { color: var(--grey-600); font-size: 16px; }
.path .go { display: inline-flex; align-items: center; gap: 6px; color: var(--blue-700); font-weight: 700; font-size: 15px; margin-top: 4px; }
.path--safety { border-top-color: var(--ochre-500); }
.path--safety .pi { color: var(--ochre-700); }
.draft-tag { justify-self: start; font: 700 11px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; background: var(--ochre-50); color: var(--ochre-700); padding: 4px 6px; }

/* mission */
.mission { display: grid; gap: 24px; }
@container site (min-width: 900px) { .mission { grid-template-columns: 5fr 7fr; gap: 64px; } }
.mission h2 { font-size: clamp(28px, 4cqi, 38px); line-height: 1.2; }
.mission .prose { display: grid; gap: 16px; max-width: 62ch; }
.vision { margin-top: 8px; padding-inline-start: 20px; border-inline-start: 4px solid var(--ochre-500); font: italic 400 19px/1.6 var(--serif); color: var(--navy-900); }
.site[lang="ar"] .vision { font-family: var(--ar-serif); font-style: normal; font-size: 20px; }
.vision cite { display: block; margin-top: 8px; font: 500 13px/1.3 var(--sans); font-style: normal; color: var(--grey-600); }

/* objectives (shared bits) */
.objs { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
@container site (min-width: 640px) { .objs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container site (min-width: 1000px) { .objs { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; } }
.obj { height: 100%; display: grid; gap: 12px; align-content: start; padding: 24px; background: var(--white); text-decoration: none; color: inherit; transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
.obj:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgb(11 37 69 / .12); }
.obj .oi { width: 48px; height: 48px; color: var(--blue-700); }
.obj h3 { font-size: 20px; line-height: 1.3; }
.obj p { font-size: 16px; color: var(--grey-600); }
.art { justify-self: start; font: 500 12px/1 var(--sans); color: var(--grey-600); border: 1px solid var(--grey-200); padding: 5px 7px; border-radius: 2px; }
.site[lang="ar"] .art { font-family: var(--ar-sans); }
.obj-top { display: flex; justify-content: space-between; align-items: center; }

/* method stepper */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; position: relative; }
.steps li { position: relative; padding-inline-start: 64px; padding-bottom: 28px; }
.steps li::before { content: ""; position: absolute; inset-inline-start: 21px; top: 44px; bottom: 0; width: 2px; background: var(--grey-200); }
.steps li:last-child::before { display: none; }
.steps .n { position: absolute; inset-inline-start: 0; top: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--blue-700); color: var(--white); font: 700 18px/1 var(--sans); }
.steps h3 { font-size: 20px; margin-bottom: 6px; padding-top: 8px; }
.steps p { color: var(--grey-600); font-size: 16px; }
@container site (min-width: 900px) {
  .steps { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
  .steps li { padding-inline-start: 0; padding-top: 64px; padding-bottom: 0; }
  .steps li::before { inset-inline-start: 52px; inset-inline-end: -24px; top: 21px; bottom: auto; width: auto; height: 2px; }
  .steps h3 { padding-top: 0; }
}

/* principles */
.princ { list-style: none; margin: 0; padding: 0; counter-reset: p; display: grid; }
.princ li { counter-increment: p; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 16px; padding-block: 18px; border-top: 1px solid var(--grey-200); }
.princ li::before { content: counter(p); font: 700 28px/1 var(--serif); color: var(--ochre-700); }
.princ b { display: block; font-size: 18px; color: var(--navy-900); margin-bottom: 4px; }
.princ span { color: var(--grey-600); font-size: 16px; }

/* advocacy */
.adv { display: grid; gap: 32px; align-items: center; }
@container site (min-width: 900px) { .adv { grid-template-columns: 7fr 5fr; gap: 64px; } }
.mech { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 20px 0 24px; }
.mech li { padding: 6px 12px; border: 1px solid var(--grey-200); background: var(--white); font-size: 14px; font-weight: 500; color: var(--navy-900); }
.adv-art { color: var(--blue-700); max-width: 360px; justify-self: center; width: 100%; }
.caveat { font-size: 14px; color: var(--grey-600); margin-top: 12px !important; }

/* CTA + footer */
.cta { display: grid; gap: 24px; align-items: center; }
@container site (min-width: 900px) { .cta { grid-template-columns: 2fr 1fr; gap: 64px; } }
.cta h2 { font-size: clamp(28px, 4cqi, 38px); }
.cta p { margin-top: 12px; font-size: 19px; color: var(--grey-600); }
.cta .btn { min-height: 56px; justify-content: center; width: 100%; }
.foot { background: var(--charcoal); color: var(--white); border-top: 4px solid var(--blue-500); padding-block: 48px 24px; font-size: 15px; }
.foot-grid { display: grid; gap: 32px; }
@container site (min-width: 768px) { .foot-grid { grid-template-columns: 2fr 1fr 1fr 1fr; } }
.foot h4 { margin: 0 0 12px; font: 700 12px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: rgb(255 255 255 / .75); }
.site[lang="ar"] .foot h4 { font-family: var(--ar-sans); letter-spacing: 0; font-size: 14px; }
.foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.foot a, .foot li span { color: var(--link-on-dark); text-decoration: none; }
.foot .lockup { color: var(--white); }
.foot .lockup small { color: rgb(255 255 255 / .8); }
.foot .lockup .div { background: rgb(255 255 255 / .3); }
.foot-about { margin-top: 16px !important; color: rgb(255 255 255 / .85); max-width: 44ch; }
.foot-legal { margin-top: 40px; padding-top: 20px; border-top: 1px solid rgb(255 255 255 / .15); display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 13px; color: rgb(255 255 255 / .8); }

/* ================= Direction A: Institutional Editorial ================= */
.A .hero { background: var(--white); padding-block: 48px 0; }
.A .hero-grid { display: grid; gap: 32px; align-items: center; }
@container site (min-width: 900px) { .A .hero-grid { grid-template-columns: 7fr 5fr; gap: 56px; } .A .hero { padding-block: 72px 0; } }
.A .hero h1 { font-size: clamp(32px, 5cqi, 54px); line-height: 1.15; max-width: 22ch; }
.A .hero .lead { margin-top: 20px; font-size: clamp(18px, 2cqi, 21px); color: var(--grey-600); max-width: 40rem; }
.A .hero .btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.A .seal { width: 100%; max-width: 420px; justify-self: center; color: var(--grey-600); }
.A .strip { margin-top: 48px; background: var(--charcoal); color: var(--white); }
@container site (min-width: 900px) { .A .strip { margin-top: 72px; } }
.A .strip ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@container site (min-width: 768px) { .A .strip ul { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.A .strip li { padding: 18px 16px; border-inline-start: 1px solid rgb(255 255 255 / .15); }
.A .strip li:first-child { border-inline-start: 0; }
.A .strip b { display: block; font: 700 22px/1.2 var(--serif); }
.site[lang="ar"].A .strip b { font-family: var(--ar-serif); }
.A .strip span { font-size: 14px; color: rgb(255 255 255 / .85); }
.A .obj { border: 1px solid var(--grey-200); border-top: 4px solid var(--blue-500); }
.A .princ-band { background: var(--ochre-50); }
.A .princ-split { display: grid; gap: 24px; }
@container site (min-width: 900px) { .A .princ-split { grid-template-columns: 5fr 7fr; gap: 64px; } }

/* ================= Direction B: Navy Seal ================= */
.B .hero { position: relative; overflow: hidden; background: linear-gradient(115deg, var(--navy-900) 0%, var(--navy-900) 50%, var(--navy-800) 100%); color: var(--white); padding-block: 56px 112px; }
[dir="rtl"] .B .hero { background: linear-gradient(-115deg, var(--navy-900) 0%, var(--navy-900) 50%, var(--navy-800) 100%); }
@container site (min-width: 900px) { .B .hero { padding-block: 96px 144px; } }
.B .hero .eyebrow { color: var(--link-on-dark); }
.B .hero h1 { color: var(--white); font-size: clamp(32px, 5.4cqi, 58px); line-height: 1.12; max-width: 20ch; position: relative; }
.B .hero .lead { margin-top: 4px; font-size: clamp(18px, 2cqi, 21px); color: rgb(255 255 255 / .9); max-width: 38rem; position: relative; }
.B .hero .btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; position: relative; }
.B .hero .btn:not(.btn--outline-light) { background: var(--blue-500); border-color: var(--blue-500); color: var(--navy-900); }
.B .hero .btn:not(.btn--outline-light):hover { background: var(--white); border-color: var(--white); }
.B .seal { position: absolute; width: min(640px, 110cqi); inset-inline-end: -16%; top: 50%; translate: 0 -50%; color: rgb(255 255 255 / .9); opacity: .55; pointer-events: none; }
@container site (max-width: 700px) { .B .seal { opacity: .22; inset-inline-end: -40%; } }
.B .strip { position: relative; margin-top: -64px; }
.B .strip ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--charcoal); color: var(--white); box-shadow: 0 12px 32px rgb(11 37 69 / .2); }
@container site (min-width: 768px) { .B .strip ul { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.B .strip li { padding: 20px; border-inline-start: 3px solid var(--ochre-500); }
.B .strip b { display: block; font: 700 24px/1.2 var(--serif); color: var(--white); }
.site[lang="ar"].B .strip b { font-family: var(--ar-serif); }
.B .strip span { font-size: 14px; color: rgb(255 255 255 / .85); }
.B .obj { position: relative; border: 0; box-shadow: 0 1px 2px rgb(11 37 69 / .08); overflow: hidden; padding-top: 32px; }
.B .obj::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; background: var(--c, var(--blue-700)); }
.B .obj .num { font: 900 44px/1 var(--serif); color: var(--c, var(--blue-700)); }
.B .obj .oi { color: var(--c, var(--blue-700)); }
.B .o1 { --c: #0070ad; } .B .o2 { --c: #0b2545; } .B .o3 { --c: #8f631d; } .B .o4 { --c: #00609a; } .B .o5 { --c: #13325a; } .B .o6 { --c: #8f631d; }
.B .princ-split { display: grid; gap: 24px; }
@container site (min-width: 900px) { .B .princ-split { grid-template-columns: 5fr 7fr; gap: 64px; } }
.B .princ li { border-top-color: rgb(255 255 255 / .15); }
.B .princ li::before { color: var(--ochre-500); }
.B .princ b { color: var(--white); }
.B .princ span { color: rgb(255 255 255 / .82); }
.B .path { border: 0; border-top: 4px solid var(--blue-500); box-shadow: 0 1px 2px rgb(11 37 69 / .08); }
.B .path--safety { border-top-color: var(--ochre-500); }

/* motion: one orchestrated moment per direction, off for reduced motion */
@media (prefers-reduced-motion: no-preference) {
  .draw { stroke-dasharray: var(--len, 1200); stroke-dashoffset: var(--len, 1200); animation: draw 1.8s var(--ease) forwards; }
  .draw.d2 { animation-delay: .25s; } .draw.d3 { animation-delay: .5s; } .draw.d4 { animation-delay: .75s; }
  .fade-in { opacity: 0; animation: fade .9s var(--ease) .9s forwards; }
  .A .hero h1, .B .hero h1 { animation: rise .7s var(--ease) both; }
  .A .hero .lead, .B .hero .lead { animation: rise .7s var(--ease) .1s both; }
  .A .hero .btns, .B .hero .btns { animation: rise .7s var(--ease) .2s both; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@keyframes rise { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }
</style>

<div class="tool" role="toolbar" aria-label="Review controls">
  <h1>ACJR homepage directions<small>Two proposals for review. Pick one, or name a mix.</small></h1>
  <div><span class="seg-label">Direction</span><span class="seg" id="seg-dir">
    <button type="button" data-v="A" aria-pressed="true">A · Institutional Editorial</button>
    <button type="button" data-v="B" aria-pressed="false">B · Navy Seal</button></span></div>
  <div><span class="seg-label">Language</span><span class="seg" id="seg-lang">
    <button type="button" data-v="fr" aria-pressed="true">FR</button>
    <button type="button" data-v="ar" aria-pressed="false">عربي</button></span></div>

/* Seal: tick ring + legal-name text ring around the mark. Same drawing, two treatments. */
function seal(variant) {
  const B = variant === 'B';
  const ticks = Array.from({ length: 72 }, (_, i) => {
    const a = (i / 72) * Math.PI * 2, r1 = 178, r2 = i % 6 === 0 ? 192 : 186;
    return `M${(200 + r1 * Math.cos(a)).toFixed(1)} ${(200 + r1 * Math.sin(a)).toFixed(1)}L${(200 + r2 * Math.cos(a)).toFixed(1)} ${(200 + r2 * Math.sin(a)).toFixed(1)}`;
  }).join('');
  const ringText = 'AFRICAN CENTER FOR JUSTICE RIGHTS · CADJ · PARIS · 2024 · ';
  const fg = B ? 'currentColor' : '#0b2545';
  return `<svg class="seal" viewBox="0 0 400 400" aria-hidden="true" fill="none">
    <defs><path id="ring-${variant}" d="M200 200m-152 0a152 152 0 1 1 304 0a152 152 0 1 1-304 0"/></defs>
    <circle class="draw" style="--len:1260" cx="200" cy="200" r="198" stroke="${B ? 'currentColor' : '#d9dee5'}" stroke-width="1"/>
    <path class="draw d2" style="--len:2400" d="${ticks}" stroke="${B ? '#c8963e' : '#009edb'}" stroke-width="1.5"/>
    <circle class="draw d2" style="--len:1070" cx="200" cy="200" r="170" stroke="${fg}" stroke-width="1"/>
    <text class="fade-in" fill="${B ? 'currentColor' : '#4d4d4d'}" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" ><textPath href="#ring-${variant}" textLength="948" lengthAdjust="spacing">${ringText}</textPath></text>
    <circle class="draw d3" style="--len:840" cx="200" cy="200" r="134" stroke="${fg}" stroke-width="1"/>
    <g class="fade-in" transform="translate(110 110) scale(.9)">${B ? mark('#ffffff', '#c8963e').replace(/^<svg[^>]*>|<\/svg>$/g, '') : mark().replace(/^<svg[^>]*>|<\/svg>$/g, '')}</g>
  </svg>`;
}

function render(dirn, lang) {

    <span class="menu-btn">${ui('menu')}${t.menu}</span></div></header>

  <section class="hero"><div class="wrap ${A ? 'hero-grid' : ''}">

      <div class="btns"><a class="btn" href="#">${t.cta1}${arrow}</a><a class="btn ${A ? 'btn--ghost' : 'btn--outline-light'}" href="#">${t.cta2}</a></div>
    </div>
    ${A ? seal('A') : ''}

  ${A ? `<div class="strip"><div class="wrap"><ul>${t.facts.map(([v, l]) => `<li><b>${v}</b><span>${l}</span></li>`).join('')}</ul></div></div>` : ''}
  </section>
  ${A ? '' : `<div class="wrap strip"><ul>${t.facts.map(([v, l]) => `<li><b>${v}</b><span>${l}</span></li>`).join('')}</ul></div>`}

  <section class="sec ${A ? '' : ''}"><div class="wrap">
    <div class="sec-head"><h2>${t.pathsTitle}</h2><p>${t.pathsLead}</p></div>
    <div class="paths">${t.paths.map(([k, ic, h, p, go]) => `<a class="path ${k ? 'path--safety' : ''}" href="#">${ui(ic, 'pi')}<span class="draft-tag">${t.draft}</span><h3>${h}</h3><p>${p}</p><span class="go">${go}${arrow}</span></a>`).join('')}</div>
  </div></section>

  <section class="sec sec--grey"><div class="wrap mission">

      <p><a class="link" href="#">${t.more}</a></p></div>
  </div></section>

  <section class="sec"><div class="wrap">
    <div class="sec-head"><h2>${t.objTitle}</h2><p>${t.objLead}</p></div>
    <ul class="objs">${t.objs.map(([id, h, p], i) => `<li><a class="obj o${i + 1}" href="#">
      <span class="obj-top">${A ? oi(id) : `<span class="num">0${i + 1}</span>`}<span class="art">${t.art} 6.${i + 1}</span></span>
      ${A ? '' : oi(id)}<h3>${h}</h3><p>${p}</p><span class="link">${t.more}</span></a></li>`).join('')}</ul>
  </div></section>

  <section class="sec sec--grey"><div class="wrap">
    <div class="sec-head"><h2>${t.howTitle}</h2><p>${t.howLead}</p></div>
    <ol class="steps">${t.how.map(([h, p], i) => `<li><span class="n">${i + 1}</span><h3>${h}</h3><p>${p}</p></li>`).join('')}</ol>
  </div></section>

  <section class="sec ${A ? 'princ-band' : 'sec--navy'}"><div class="wrap princ-split">
    <div><h2 style="font-size:clamp(28px,4cqi,38px)">${t.prTitle}</h2><hr class="rule-ochre"><p style="font-size:19px;${A ? 'color:#4d4d4d' : 'color:rgb(255 255 255 / .88)'}">${t.prLead}</p>

    <ol class="princ">${t.pr.map(([b, s]) => `<li><div><b>${b}</b><span>${s}</span></div></li>`).join('')}</ol>
  </div></section>

  <section class="sec"><div class="wrap adv">
    <div><p class="eyebrow">${t.advEyebrow}</p><h2 style="font-size:clamp(28px,4cqi,38px)">${t.advTitle}</h2>
      <ul class="mech">${t.mech.map((m) => `<li>${m}</li>`).join('')}</ul>
      <p>${t.advText}</p><p class="caveat">${t.caveat}</p>

  <footer class="foot"><div class="wrap">
    <div class="foot-grid"><div>${lockup(true)}<p class="foot-about">${t.fAbout}</p></div>

    <div class="foot-legal">${t.fLegal.map((x) => `<span>${x}</span>`).join('')}</div>
  </div></footer>`;
}

const NOTES = {
  A: '<strong>A · Institutional Editorial.</strong> A calm white hero with a serif headline beside a seal built from ACJR’s legal name and logo. A charcoal fact strip (the ONU Info date strip), editorial cards and a light ochre principles band. Closest to ohchr.org.',
  B: '<strong>B · Navy Seal.</strong> An immersive navy hero where the seal draws itself on load, and a floating fact strip. Numbered objective tiles each carry a theme colour stripe; principles sit on navy. Bolder, closer to a campaign landing page.',
};
const state = { dir: 'A', lang: 'fr', frame: 'desktop' };
function apply() {
  const site = document.getElementById('site');
  site.className = 'site ' + state.dir;
  site.lang = state.lang;
  site.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  site.innerHTML = render(state.dir, state.lang);
  site.querySelectorAll('a[href="#"]').forEach((a) => a.addEventListener('click', (e) => e.preventDefault()));
  document.getElementById('frame').classList.toggle('is-mobile', state.frame === 'mobile');
  document.getElementById('note').innerHTML = NOTES[state.dir] + ' Everything here is real copy from the site, except the three “Where to start” cards (new draft text, marked on each card). Motion is off when the system asks for reduced motion.';
}
for (const [id, key] of [['seg-dir', 'dir'], ['seg-lang', 'lang'], ['seg-frame', 'frame']]) {
  const seg = document.getElementById(id);
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = b.dataset.v;
    seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    apply();
  });
}
const h = location.hash.slice(1);
if (/^[AB]$/.test(h)) { state.dir = h; document.querySelectorAll('#seg-dir button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.v === h))); }
apply();
</script>
